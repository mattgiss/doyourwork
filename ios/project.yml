# Generates DOYOURWORK.xcodeproj. Run `xcodegen` in this folder after adding or removing files.
name: DOYOURWORK
# One app, for the App Store and TestFlight alike. Everything stays on the device until someone
# adds a phone; then it syncs through the encrypted relay (docs/design/encrypted-relay-join.md).
configs:
  Debug: debug
  Release: release
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  DoYourWorkCore:
    path: DoYourWorkCore
targets:
  DOYOURWORK:
    type: application
    platform: iOS
    sources:
      - path: DOYOURWORK
      - path: ../native/chores.json
        buildPhase: resources
        group: Shared
      - path: ../native/puzzles.json
        buildPhase: resources
        group: Shared
    dependencies:
      - package: DoYourWorkCore
      - target: DOYOURWORKWidgets
    # The App Group is where the app leaves the widgets' snapshot (WidgetBridge.swift).
    entitlements:
      path: DOYOURWORK/DOYOURWORK.entitlements
      properties:
        com.apple.security.application-groups: [group.com.gyattchores.app]
    settings:
      base:
        # Kept from the app's first name: changing it would make a new app, and installed phones
        # would stop getting updates.
        PRODUCT_BUNDLE_IDENTIFIER: com.gyattchores.app
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone and iPad
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: R2Z257C2EH
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DOYOURWORK
        INFOPLIST_KEY_NSFaceIDUsageDescription: Open the admin area to approve chores.
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the code another phone shows to join its family.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Dark only, like Clear.
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        # Portrait on a phone; any way up on an iPad (which also lets it share the screen with other apps).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # Home and lock screen widgets. They read the snapshot the app writes to the App Group.
  DOYOURWORKWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: DOYOURWORKWidgets
      # The app's typeface, shared with the app target.
      - path: DOYOURWORK/Fonts
        buildPhase: resources
    dependencies:
      - package: DoYourWorkCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: DOYOURWORKWidgets/Info.plist
      properties:
        CFBundleDisplayName: DOYOURWORK
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: DOYOURWORKWidgets/DOYOURWORKWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.gyattchores.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gyattchores.app.widgets
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: R2Z257C2EH
        SKIP_INSTALL: YES
  DOYOURWORKUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DOYOURWORKUITests
    dependencies:
      - target: DOYOURWORK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doyourwork.app.uitests
        TEST_TARGET_NAME: DOYOURWORK
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone and iPad
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: R2Z257C2EH
        GENERATE_INFOPLIST_FILE: YES

# A shared scheme, so `xcodebuild` (CI) and Xcode use the same build and test setup.
schemes:
  DOYOURWORK:
    build:
      targets:
        DOYOURWORK: all
        DOYOURWORKUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DOYOURWORKUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
